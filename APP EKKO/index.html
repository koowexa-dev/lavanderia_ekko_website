<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <title>APP EKKO</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#f5f5f7;--surface:#fff;--text:#1a1a1f;--text-light:#3a3a40;--border:#d4d4d8;--primary:#2563eb;--primary-dark:#1d4ed8;--success:#16a34a;--danger:#dc2626;--tip-bg:#eef2ff;--tip-text:#1e40af}
        body{background:var(--bg);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--text);padding:4px;line-height:1.3}
        .reserva-wrapper{max-width:820px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
        .reserva-header{padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .reserva-header h1{font-size:1.1rem;font-weight:700}
        .reserva-header p{font-size:0.65rem;color:var(--text-light)}
        .tips-banner{background:var(--tip-bg);color:var(--tip-text);padding:4px 12px;margin:4px 12px;display:flex;align-items:center;gap:8px;font-size:0.7rem;border-left:3px solid var(--primary);border-radius:4px}
        .tips-banner .tip-text{flex:1}
        .tips-banner .close-tips{background:none;border:none;font-size:1rem;cursor:pointer;color:var(--tip-text);opacity:0.6;padding:0 4px}
        .reserva-form{padding:8px 12px}
        .seccion{margin-bottom:12px}
        .seccion-titulo{font-size:0.75rem;font-weight:600;margin-bottom:4px;color:var(--text-light);border-bottom:1px solid var(--border);padding-bottom:2px;display:flex;align-items:center;gap:4px}
        .cliente-card{background:#f1f5f9;border-radius:6px;padding:8px 10px;border:1px solid #e2e8f0}
        .cliente-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
        .cliente-grid .full-width{grid-column:1/-1}
        .cliente-grid label{font-size:0.6rem;font-weight:600;display:block;color:var(--text-light);margin-bottom:0}
        .cliente-grid input,.cliente-grid textarea{width:100%;padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:0.75rem;background:var(--surface);color:var(--text)}
        .cliente-grid textarea{height:28px;min-height:28px;resize:vertical}
        .cliente-grid input:focus,.cliente-grid textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(37,99,235,0.1)}
        .form-group.compact{margin-bottom:4px}
        .planes-group{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg);padding:4px 6px;border-radius:4px;border:1px solid var(--border)}
        .planes-group label{background:var(--surface);padding:2px 10px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:14px;font-size:0.7rem;margin:0;transition:all .1s}
        .planes-group label:has(input:checked){background:var(--primary);color:#fff;border-color:var(--primary)}
        .planes-group input{width:auto;margin-right:1px}
        .categoria-badge{background:var(--primary);color:#fff;border-radius:12px;padding:0 8px;font-size:0.6rem;font-weight:600;display:inline-block;margin-left:4px}
        .peso-input-group{display:flex;align-items:center;gap:6px;background:var(--bg);padding:2px 6px 2px 10px;border-radius:4px;border:1px solid var(--border);flex-wrap:wrap}
        .peso-input-group input{flex:1;border:none;background:transparent;padding:3px 2px;font-size:0.8rem;min-width:60px;max-width:100px}
        .peso-input-group input:focus{outline:none}
        .peso-input-group span{font-weight:600;color:var(--text-light);font-size:0.7rem}
        .btn-agregar-peso{background:var(--primary);border:none;color:#fff;padding:3px 14px;font-weight:600;cursor:pointer;font-size:0.7rem;border-radius:14px;transition:background .1s;white-space:nowrap}
        .btn-agregar-peso:hover{background:var(--primary-dark)}
        .btn-agregar-peso:disabled{opacity:0.5}
        .pesos-lista{background:var(--bg);border-left:2px solid var(--primary);padding:4px 8px;margin-top:4px;border-radius:2px}
        .peso-item{display:flex;justify-content:space-between;align-items:center;background:var(--surface);margin:2px 0;padding:2px 8px;border:1px solid var(--border);border-radius:3px;font-size:0.7rem}
        .eliminar-peso{background:none;border:none;color:var(--danger);font-size:1rem;cursor:pointer;font-weight:bold;padding:0 4px;line-height:1}
        .extras-grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
        .extras-grid label{display:flex;align-items:center;gap:4px;background:var(--bg);padding:2px 12px;cursor:pointer;border:1px solid var(--border);border-radius:14px;font-weight:400;font-size:0.7rem;margin:0}
        .extras-grid input{width:auto;margin:0}
        .resumen-card{background:var(--bg);padding:6px 10px;border-radius:4px;border:1px solid var(--border)}
        .resumen-card .servicio-item{display:flex;justify-content:space-between;align-items:center;background:var(--surface);padding:2px 8px;border-radius:3px;margin-bottom:2px;border:1px solid var(--border)}
        .resumen-card .servicio-item .detalle{flex:1;font-size:0.7rem}
        .resumen-card .servicio-item .total{font-weight:700;color:var(--primary-dark);margin:0 6px;font-size:0.75rem}
        .resumen-card .total-general{font-size:0.85rem;font-weight:700;background:var(--primary-dark);display:inline-block;padding:2px 14px;border-radius:14px;color:#fff}
        .btn-modal{padding:4px 14px;font-weight:600;border:none;cursor:pointer;font-size:0.7rem;border-radius:14px;transition:background .1s}
        .btn-guardar{background:var(--success);color:#fff}
        .btn-guardar:hover{background:#15803d}
        .btn-enviar{background:var(--primary);color:#fff}
        .btn-enviar:hover{background:var(--primary-dark)}
        .btn-cancelar{background:#e5e7eb;color:var(--text)}
        .btn-cancelar:hover{background:#d1d5db}
        .btn-eliminar-servicio{background:var(--danger);color:#fff;border:none;border-radius:10px;padding:0 8px;font-size:0.6rem;cursor:pointer;line-height:1.6}
        .btn-eliminar-servicio:hover{background:#b91c1c}
        .acciones{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
        .aviso-categorizacion{background:#f0f9ff;border-left:2px solid #2563eb;padding:4px 10px;margin-top:6px;border-radius:2px;font-size:0.65rem;color:#1e293b}
        .precio-estimado{font-weight:600;color:var(--primary-dark);font-size:0.75rem;margin-left:4px}
        .servicios-lista{max-height:140px;overflow-y:auto}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000}
        .modal-content{background:var(--surface);border-radius:10px;max-width:500px;width:90%;padding:16px;color:var(--text)}
        .message-preview{background:var(--bg);padding:8px;font-family:monospace;font-size:0.65rem;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word;border-radius:4px;border:1px solid var(--border);line-height:1.4}
        .toast-simple{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:4px 20px;border-radius:20px;font-size:0.7rem;z-index:2000;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
        .row-flex{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
        .badge-cant{background:var(--primary);color:#fff;border-radius:12px;padding:0 8px;font-size:0.6rem;margin-left:4px}
        .categoria-actual{font-size:0.7rem;font-weight:600;color:var(--text-light);margin-bottom:3px}
        .categoria-actual span{background:var(--primary);color:#fff;padding:0 10px;border-radius:12px;font-size:0.65rem;margin-left:6px}
        @media(max-width:480px){.cliente-grid{grid-template-columns:1fr}.reserva-form{padding:4px 8px}.cliente-card{padding:6px 8px}}
    </style>
</head>
<body>
<div class="reserva-wrapper">
    <div class="reserva-header">
        <div><h1>APP EKKO</h1><p>RESERVACIONES DEL SERVICIO</p></div>
    </div>
    <div id="tipsBanner" class="tips-banner">
        <span class="tip-text" id="tipMessage">ANUNCIOS</span>
        <button class="close-tips" id="closeTipsBtn">✕</button>
    </div>
    <div id="reservaForm" class="reserva-form"></div>
</div>
<div id="toast-notification" class="toast-simple"></div>

<script>
    // ==================== DATOS ====================
    const PLANES_DETALLE = {
        'BÁSICO': { categoria: 'ESENCIAL', umbrales: [1.9,2.9,3.9,4.9,5.9,6.9,7.0], precios: [700,800,900,1000,1100,1200,1300] },
        'WORKING': { categoria: 'ESENCIAL', umbrales: [1.9,2.9,3.9,4.9], precios: [900,1100,1200,1300] },
        'PREMIUM': { categoria: 'MEJORADO', umbrales: [1.9,2.9,3.9,4.9,5.9,6.9,7.0], precios: [800,900,1000,1100,1200,1300,1400] },
        'DEPORTE': { categoria: 'MEJORADO', umbrales: [1.9,2.9,3.9,4.9], precios: [800,900,1000,1100] },
        'VESTIR': { categoria: 'SUPERIOR', umbrales: [1.9,2.9,3.9,4.9], precios: [1000,1100,1200,1300] },
        'UNIFORME': { categoria: 'SUPERIOR', umbrales: [1.9,2.9,3.9,4.9], precios: [1000,1100,1200,1300] },
        'ESPECIAL': { categoria: 'EXCLUSIVA', umbrales: [1.9,2.9,3.9,4.9,5.9,6.9,7.0], precios: [1000,1100,1200,1300,1400,1500,1600] },
        'EKKO BABY ESTANDAR': { categoria: 'BEBÉ', pesoFijo: 3, precioFijo: 1500 },
        'EKKO BABY PREMIUM': { categoria: 'BEBÉ', pesoFijo: 3, precioFijo: 2500 }
    };
    const CATEGORIAS = {
        'ESENCIAL': ['BÁSICO','WORKING'],
        'MEJORADO': ['PREMIUM','DEPORTE'],
        'SUPERIOR': ['VESTIR','UNIFORME'],
        'EXCLUSIVA': ['ESPECIAL'],
        'BEBÉ': ['EKKO BABY ESTANDAR','EKKO BABY PREMIUM']
    };
    const TODAS_CATEGORIAS = Object.keys(CATEGORIAS);
    const PRECIOS_EXTRAS = { perlas: 600 };
    const EXTRAS_NOMBRES = { perlas: '✨ Perlas' };
    const TIPS_MESSAGES = [
        "AGREGARÉ PERLA A TUS PRENDAS, PARA FIJAR SU AROMA",
        "TE RECOMENDAMOS EL PLAN ESPECIAL, SI QUIERES UN CUIDADO EXCEPCIONAL EN TUs PRENDAS",
        "ELIGE EL PLAN BABY PREMIUM, SI QUIERES QUE TUS PELUCHES Y CORCHAS RELUZCAN PARA TU BEBE"
    ];

    // ==================== ESTADO ====================
    let state = {
        servicios: [],
        servicioActual: { categoria: 'ESENCIAL', plan: 'BÁSICO', pesos: [] },
        extras: { perlas: false },
        cliente: { nombre: '', telefono: '', direccion: '', carnet: '', fechaHora: '', especificaciones: '', tipoPrendasCantidad: '' },
        whatsappNumber: '5352952442'
    };

    // ==================== AUXILIARES ====================
    function obtenerMaximoPeso(plan) {
        const d = PLANES_DETALLE[plan];
        if (!d) return 0;
        if (d.pesoFijo) return d.pesoFijo;
        return d.umbrales[d.umbrales.length-1];
    }
    function obtenerPrecioPorPeso(plan, peso) {
        const d = PLANES_DETALLE[plan];
        if (!d) return 0;
        if (d.pesoFijo) return (Math.abs(peso - d.pesoFijo) < 0.01) ? d.precioFijo : 0;
        const u = d.umbrales, p = d.precios;
        for (let i=0;i<u.length;i++) if (peso <= u[i]) return p[i];
        return p[p.length-1] || 0;
    }
    function calcularTotalServicio(servicio) {
        return servicio.pesos.reduce((s, item) => s + item.precio, 0);
    }
    function calcularTotalExtras() {
        return Object.entries(state.extras).reduce((s, [k,a]) => a ? s + PRECIOS_EXTRAS[k] : s, 0);
    }
    function calcularTotalGeneral() {
        return state.servicios.reduce((s, sv) => s + calcularTotalServicio(sv), 0) + calcularTotalExtras();
    }
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
    function obtenerCategoria(plan) {
        return PLANES_DETALLE[plan]?.categoria || '';
    }

    // ==================== INDEXEDDB ====================
    const DB_NAME = 'EkoReservasDB', STORE_NAME = 'reservas';
    let db = null;
    function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onerror = () => reject(req.error);
            req.onsuccess = () => { db = req.result; resolve(db); };
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME))
                    db.createObjectStore(STORE_NAME, { autoIncrement: true });
            };
        });
    }
    async function guardarReservaIndexed(reserva) {
        if (!db) await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const req = store.add(reserva);
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error);
        });
    }

    // ==================== TOAST ====================
    function showToast(msg, isErr=false) {
        const t = document.getElementById('toast-notification');
        t.textContent = msg;
        t.style.backgroundColor = isErr ? '#b91c1c' : '#15803d';
        t.style.opacity = '1';
        clearTimeout(t._hide);
        t._hide = setTimeout(() => t.style.opacity = '0', 2000);
    }

    // ==================== MENSAJE WHATSAPP ====================
    function construirMensaje() {
        const c = state.cliente;
        let lines = [];
        lines.push('🧺 *LAVANDERÍA EKKO - RESERVA*');
        lines.push('━━━━━━━━━━━━━━━━━━');
        lines.push(`👤 ${c.nombre}`);
        lines.push(`📞 ${c.telefono} | 📍 ${c.direccion}`);
        lines.push(`🆔 ${c.carnet} | 📅 ${c.fechaHora}`);
        if (c.especificaciones) lines.push(`📝 ${c.especificaciones}`);
        if (c.tipoPrendasCantidad) lines.push(`👕 ${c.tipoPrendasCantidad}`);
        lines.push('━━━━━━━━━━━━━━━━━━');
        state.servicios.forEach((s) => {
            const total = calcularTotalServicio(s);
            const cat = s.categoria || obtenerCategoria(s.plan);
            lines.push(`▸ ${s.plan} (${cat}) — $${total}`);
            s.pesos.forEach(p => {
                const d = s.plan.includes('BABY') ? '3kg' : `${p.peso}kg`;
                lines.push(`   ${d}: $${p.precio}`);
            });
        });
        lines.push('━━━━━━━━━━━━━━━━━━');
        const extras = Object.keys(state.extras).filter(k => state.extras[k]);
        if (extras.length) extras.forEach(k => lines.push(`✨ ${EXTRAS_NOMBRES[k]} +$${PRECIOS_EXTRAS[k]}`));
        else lines.push('✨ Sin extras');
        lines.push(`💰 *TOTAL: $${calcularTotalGeneral()}*`);
        return lines.join('\n');
    }

    // ==================== RENDER PRINCIPAL ====================
    function renderizarFormulario() {
        const container = document.getElementById('reservaForm');
        const c = state.cliente;

        const catOptions = TODAS_CATEGORIAS.map(cat =>
            `<option value="${cat}" ${state.servicioActual.categoria===cat?'selected':''}>${cat}</option>`
        ).join('');

        const planes = CATEGORIAS[state.servicioActual.categoria] || [];
        const planRadios = planes.map(p => {
            const cat = obtenerCategoria(p);
            return `<label><input type="radio" name="planRadio" value="${p}" ${state.servicioActual.plan===p?'checked':''}> ${p} <span class="categoria-badge">${cat}</span></label>`;
        }).join('');

        const extrasHtml = Object.entries(PRECIOS_EXTRAS).map(([k,v]) =>
            `<label><input type="checkbox" data-extra="${k}" ${state.extras[k]?'checked':''}> ${EXTRAS_NOMBRES[k]} (+$${v})</label>`
        ).join('');

        // Resumen
        let serviciosHtml = '';
        if (state.servicios.length === 0) {
            serviciosHtml = '<p style="font-size:0.7rem;color:var(--text-light);margin:2px 0;">Sin servicios</p>';
        } else {
            serviciosHtml = `<div class="servicios-lista">`;
            state.servicios.forEach((s, idx) => {
                const total = calcularTotalServicio(s);
                const cat = s.categoria || obtenerCategoria(s.plan);
                const detalle = s.pesos.map(p => s.plan.includes('BABY') ? '3kg' : `${p.peso}kg`).join(', ');
                serviciosHtml += `
                    <div class="servicio-item">
                        <span class="detalle"><strong>${s.plan}</strong> <span class="categoria-badge">${cat}</span> ${detalle}</span>
                        <span class="total">$${total}</span>
                        <button class="btn-eliminar-servicio" data-idx="${idx}">✕</button>
                    </div>
                `;
            });
            serviciosHtml += `</div>`;
        }

        const totalServicios = state.servicios.reduce((s, sv) => s + calcularTotalServicio(sv), 0);
        const totalExtras = calcularTotalExtras();
        const totalFinal = totalServicios + totalExtras;

        container.innerHTML = `
            <!-- TARJETA CLIENTE COMPACTA -->
            <div class="seccion">
                <div class="seccion-titulo">👤 Cliente</div>
                <div class="cliente-card">
                    <div class="cliente-grid">
                        <div><label>Nombre *</label><input type="text" id="clienteNombre" value="${escapeHtml(c.nombre)}" placeholder="Ana Pérez"></div>
                        <div><label>Teléfono *</label><input type="tel" id="clienteTelefono" value="${escapeHtml(c.telefono)}" placeholder="5352952442"></div>
                        <div><label>Dirección *</label><input type="text" id="clienteDireccion" value="${escapeHtml(c.direccion)}" placeholder="Calle y #"></div>
                        <div><label>Carnet (11 díg) *</label><input type="text" id="clienteCarnet" maxlength="11" value="${escapeHtml(c.carnet)}" placeholder="12345678901"></div>
                        <div><label>Fecha/hora *</label><input type="datetime-local" id="clienteFechaHora" value="${c.fechaHora}"></div>
                        <div><label>Tipo/cant prendas</label><input type="text" id="clienteTipoPrendas" value="${escapeHtml(c.tipoPrendasCantidad)}" placeholder="camisas(5)"></div>
                        <div class="full-width"><label>Especificaciones</label><textarea id="clienteEspecificaciones" rows="1" placeholder="Detalles...">${escapeHtml(c.especificaciones)}</textarea></div>
                    </div>
                </div>
            </div>

            <!-- SERVICIO -->
            <div class="seccion">
                <div class="seccion-titulo">🧺 Servicio</div>
                <div class="form-group compact"><label style="font-size:0.65rem;">Categoría</label>
                    <select id="categoriaSelect" style="width:100%;padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:0.75rem;background:var(--surface);">${catOptions}</select>
                </div>
                <div class="form-group compact">
                    <div class="categoria-actual">Categoría seleccionada: <span id="categoriaActualDisplay">${state.servicioActual.categoria}</span></div>
                    <label style="font-size:0.65rem;">Plan</label>
                    <div class="planes-group" id="planesGroup">${planRadios}</div>
                </div>
                <div id="contenedorPesos"></div>
                <div class="aviso-categorizacion">📌 (AVISO) TODAS LAS PRENDAS SERÁN EVALUADAS Y CATEGORIZADAS CORRECTAMENTE ANTES DE SU TRATAMIENTO, PARA GARANTIZAR UN EXCELENTE SERVICIO Y ATENCIÓN AL CLIENTE.</div>
                <div class="acciones">
                    <button id="guardarServicioBtn" class="btn-modal btn-guardar">Añadir a la solicitud</button>
                    <button id="limpiarServicioBtn" class="btn-modal btn-cancelar">Borrar todo</button>
                </div>
            </div>

            <!-- EXTRAS -->
            <div class="seccion">
                <div class="seccion-titulo">✨ Extras</div>
                <div class="extras-grid">${extrasHtml}</div>
            </div>

            <!-- RESUMEN -->
            <div class="seccion">
                <div class="seccion-titulo">📊 Resumen</div>
                <div class="resumen-card" id="resumenCard">
                    ${serviciosHtml}
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:4px;gap:4px;">
                        <span style="font-size:0.7rem;"><strong>Servicios:</strong> $${totalServicios}</span>
                        <span style="font-size:0.7rem;"><strong>Extras:</strong> $${totalExtras}</span>
                        <span class="total-general">Total: $${totalFinal}</span>
                    </div>
                </div>
            </div>

            <div class="acciones" style="justify-content:flex-end;border-top:1px solid var(--border);padding-top:8px;">
                <button id="previewBtn" class="btn-modal btn-enviar">📨 Enviar</button>
                <button id="resetBtn" class="btn-modal btn-cancelar">🔄 Reiniciar</button>
            </div>
        `;

        // ===== EVENTOS =====
        document.getElementById('clienteNombre').addEventListener('input', e => state.cliente.nombre = e.target.value);
        document.getElementById('clienteTelefono').addEventListener('input', e => state.cliente.telefono = e.target.value);
        document.getElementById('clienteDireccion').addEventListener('input', e => state.cliente.direccion = e.target.value);
        document.getElementById('clienteCarnet').addEventListener('input', function(e) {
            const val = this.value.replace(/\D/g,'').slice(0,11);
            this.value = val;
            state.cliente.carnet = val;
        });
        document.getElementById('clienteFechaHora').addEventListener('input', e => state.cliente.fechaHora = e.target.value);
        document.getElementById('clienteTipoPrendas').addEventListener('input', e => state.cliente.tipoPrendasCantidad = e.target.value);
        document.getElementById('clienteEspecificaciones').addEventListener('input', e => state.cliente.especificaciones = e.target.value);

        document.getElementById('categoriaSelect').addEventListener('change', function() {
            const cat = this.value;
            state.servicioActual.categoria = cat;
            const planes = CATEGORIAS[cat] || [];
            if (planes.length) state.servicioActual.plan = planes[0];
            state.servicioActual.pesos = [];
            renderizarFormulario();
        });

        document.querySelectorAll('input[name="planRadio"]').forEach(r => {
            r.addEventListener('change', function() {
                state.servicioActual.plan = this.value;
                // Actualizar la categoría mostrada (la categoría del plan seleccionado)
                const cat = obtenerCategoria(this.value);
                state.servicioActual.categoria = cat; // sincronizar
                document.getElementById('categoriaActualDisplay').textContent = cat;
                // También actualizar el select de categoría para que coincida
                document.getElementById('categoriaSelect').value = cat;
                state.servicioActual.pesos = [];
                configurarPesos();
                actualizarListaPesos();
                actualizarResumen();
            });
        });

        document.querySelectorAll('[data-extra]').forEach(cb => {
            cb.addEventListener('change', function() {
                const key = this.dataset.extra;
                if (key && state.extras.hasOwnProperty(key)) {
                    state.extras[key] = this.checked;
                    actualizarResumen();
                }
            });
        });

        document.getElementById('guardarServicioBtn').addEventListener('click', guardarServicio);
        document.getElementById('limpiarServicioBtn').addEventListener('click', () => {
            state.servicioActual.pesos = [];
            actualizarListaPesos();
            actualizarResumen();
            showToast('Pesos limpiados');
        });
        document.getElementById('previewBtn').addEventListener('click', mostrarPreviewYEnviar);
        document.getElementById('resetBtn').addEventListener('click', resetFormulario);

        configurarPesos();
        actualizarListaPesos();
        actualizarResumen();
    }

    // ========== PESOS ==========
    function configurarPesos() {
        const cont = document.getElementById('contenedorPesos');
        if (!cont) return;
        const plan = state.servicioActual.plan;
        const esBaby = plan.includes('BABY');

        if (esBaby) {
            cont.innerHTML = `
                <div class="row-flex" style="margin-top:4px;">
                    <input type="number" id="babyCantidad" value="1" min="1" step="1" style="width:60px;padding:3px 4px;border:1px solid var(--border);border-radius:4px;font-size:0.75rem;">
                    <button class="btn-agregar-peso" id="agregarBabyBtn">➕ Añadir paquete(s)</button>
                </div>
                <div id="pesosSeleccionadosLista" class="pesos-lista"></div>
            `;
            document.getElementById('agregarBabyBtn').addEventListener('click', () => {
                const q = parseInt(document.getElementById('babyCantidad').value) || 1;
                if (q < 1) return;
                const maxUnidades = 15;
                if (state.servicioActual.pesos.length + q > maxUnidades) {
                    showToast(`Máximo ${maxUnidades} unidades`, true);
                    return;
                }
                const detalle = PLANES_DETALLE[plan];
                for (let i=0;i<q;i++) {
                    state.servicioActual.pesos.push({ peso: detalle.pesoFijo, precio: detalle.precioFijo });
                }
                actualizarListaPesos();
                actualizarResumen();
                document.getElementById('babyCantidad').value = 1;
                showToast(`${q} paquete(s) agregado`);
            });
        } else {
            cont.innerHTML = `
                <div class="row-flex" style="margin-top:4px;">
                    <input type="number" id="pesoInput" step="0.1" min="0.1" value="1.0" style="width:70px;padding:3px 4px;border:1px solid var(--border);border-radius:4px;font-size:0.75rem;">
                    <span style="font-size:0.7rem;font-weight:600;">kg</span>
                    <span class="precio-estimado" id="precioEstimado">$0</span>
                    <button class="btn-agregar-peso" id="agregarPesoBtn">➕ Añadir</button>
                </div>
                <div id="pesosSeleccionadosLista" class="pesos-lista"></div>
            `;
            const inputPeso = document.getElementById('pesoInput');
            const estimado = document.getElementById('precioEstimado');
            inputPeso.addEventListener('input', function() {
                const p = parseFloat(this.value);
                if (!p || p <= 0) { estimado.textContent = '$0'; return; }
                const precio = obtenerPrecioPorPeso(plan, p);
                estimado.textContent = precio ? `$${precio}` : '⛔';
            });
            document.getElementById('agregarPesoBtn').addEventListener('click', () => {
                const p = parseFloat(inputPeso.value);
                if (!p || p <= 0) { showToast('Peso válido', true); return; }
                const maxPeso = obtenerMaximoPeso(plan);
                const totalActual = state.servicioActual.pesos.reduce((s, item) => s + item.peso, 0);
                if (totalActual + p > maxPeso) {
                    showToast(`Máximo ${maxPeso} kg`, true);
                    return;
                }
                const precio = obtenerPrecioPorPeso(plan, p);
                if (!precio) { showToast('Error precio', true); return; }
                state.servicioActual.pesos.push({ peso: p, precio });
                actualizarListaPesos();
                actualizarResumen();
                inputPeso.value = '';
                estimado.textContent = '$0';
                showToast(`${p}kg -> $${precio}`);
            });
        }
        actualizarListaPesos();
    }

    function actualizarListaPesos() {
        const c = document.getElementById('pesosSeleccionadosLista');
        if (!c) return;
        const pesos = state.servicioActual.pesos;
        if (!pesos.length) {
            c.innerHTML = '<p style="color:var(--text-light);font-size:0.65rem;margin:2px 0;">Sin pesos.</p>';
            return;
        }
        const plan = state.servicioActual.plan;
        c.innerHTML = pesos.map((item, idx) => {
            const desc = plan.includes('BABY') ? 'Paq. 3kg' : `${item.peso}kg`;
            return `<div class="peso-item"><span>${desc} — $${item.precio}</span><button class="eliminar-peso" data-idx="${idx}">✕</button></div>`;
        }).join('');
        c.querySelectorAll('.eliminar-peso').forEach(b => {
            b.addEventListener('click', function() {
                const idx = parseInt(this.dataset.idx);
                state.servicioActual.pesos.splice(idx, 1);
                actualizarListaPesos();
                actualizarResumen();
            });
        });
    }

    function actualizarResumen() {
        const card = document.getElementById('resumenCard');
        if (!card) return;
        let html = '';
        if (state.servicios.length === 0) {
            html = '<p style="font-size:0.7rem;color:var(--text-light);margin:2px 0;">Sin servicios</p>';
        } else {
            html = `<div class="servicios-lista">`;
            state.servicios.forEach((s, idx) => {
                const total = calcularTotalServicio(s);
                const cat = s.categoria || obtenerCategoria(s.plan);
                const detalle = s.pesos.map(p => s.plan.includes('BABY') ? '3kg' : `${p.peso}kg`).join(', ');
                html += `
                    <div class="servicio-item">
                        <span class="detalle"><strong>${s.plan}</strong> <span class="categoria-badge">${cat}</span> ${detalle}</span>
                        <span class="total">$${total}</span>
                        <button class="btn-eliminar-servicio" data-idx="${idx}">✕</button>
                    </div>
                `;
            });
            html += `</div>`;
        }
        const totalServicios = state.servicios.reduce((s, sv) => s + calcularTotalServicio(sv), 0);
        const totalExtras = calcularTotalExtras();
        const totalFinal = totalServicios + totalExtras;
        html += `
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:4px;gap:4px;">
                <span style="font-size:0.7rem;"><strong>Servicios:</strong> $${totalServicios}</span>
                <span style="font-size:0.7rem;"><strong>Extras:</strong> $${totalExtras}</span>
                <span class="total-general">Total: $${totalFinal}</span>
            </div>
        `;
        card.innerHTML = html;

        card.querySelectorAll('.btn-eliminar-servicio').forEach(b => {
            b.addEventListener('click', function() {
                const idx = parseInt(this.dataset.idx);
                state.servicios.splice(idx, 1);
                actualizarResumen();
                showToast('Servicio eliminado');
            });
        });
    }

    function guardarServicio() {
        if (state.servicioActual.pesos.length === 0) {
            showToast('Agrega al menos un peso', true);
            return;
        }
        // Asegurar que la categoría esté sincronizada con el plan seleccionado
        const plan = state.servicioActual.plan;
        const cat = obtenerCategoria(plan);
        state.servicioActual.categoria = cat; // actualizar por si acaso
        state.servicios.push({
            categoria: cat,
            plan: plan,
            pesos: state.servicioActual.pesos.map(p => ({ ...p }))
        });
        state.servicioActual.pesos = [];
        actualizarListaPesos();
        actualizarResumen();
        showToast('Servicio guardado ✅');
    }

    function resetFormulario() {
        state.servicios = [];
        state.servicioActual = { categoria: 'ESENCIAL', plan: 'BÁSICO', pesos: [] };
        state.extras = { perlas: false };
        state.cliente = { nombre: '', telefono: '', direccion: '', carnet: '', fechaHora: '', especificaciones: '', tipoPrendasCantidad: '' };
        renderizarFormulario();
        showToast('Todo reiniciado');
    }

    // ========== PREVIEW Y ENVÍO ==========
    async function mostrarPreviewYEnviar() {
        const c = state.cliente;
        if (!c.nombre || !c.telefono || !c.direccion || !c.carnet || !c.fechaHora) {
            showToast('Completa todos los datos (*)', true);
            return;
        }
        if (!/^\d{11}$/.test(c.carnet)) {
            showToast('Carnet 11 dígitos', true);
            return;
        }
        if (state.servicios.length === 0) {
            showToast('Guarda al menos un servicio', true);
            return;
        }

        const mensaje = construirMensaje();
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal-content">
                <h4 style="margin-bottom:6px;">📋 Vista previa</h4>
                <div class="message-preview">${mensaje.replace(/\n/g, '<br>')}</div>
                <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
                    <button id="confirmarEnvio" class="btn-modal btn-enviar">📨 Enviar</button>
                    <button id="cerrarPreview" class="btn-modal btn-cancelar">Cancelar</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);

        document.getElementById('confirmarEnvio').onclick = async () => {
            const num = state.whatsappNumber;
            if (!/^\d{7,15}$/.test(num)) { showToast('Número inválido', true); return; }
            const url = `https://wa.me/${num}?text=${encodeURIComponent(mensaje)}`;
            const reserva = {
                cliente: { ...state.cliente },
                servicios: state.servicios.map(s => ({
                    categoria: s.categoria,
                    plan: s.plan,
                    pesos: s.pesos.map(p => ({ ...p }))
                })),
                extras: { ...state.extras },
                total: calcularTotalGeneral(),
                fechaRegistro: new Date().toISOString()
            };
            try { await guardarReservaIndexed(reserva); } catch (err) { console.warn(err); }
            if (navigator.share && /Mobi|Android|iPhone/i.test(navigator.userAgent)) {
                try { await navigator.share({ text: mensaje }); } catch (e) {}
            } else {
                window.open(url, '_blank');
            }
            showToast('Redirigiendo...');
            modal.remove();
        };
        document.getElementById('cerrarPreview').onclick = () => modal.remove();
    }

    // ========== TIPS ==========
    let tipInterval = null, tipIndex = 0;
    function iniciarRotacionTips() {
        const el = document.getElementById('tipMessage');
        if (!el) return;
        tipIndex = Math.floor(Math.random() * TIPS_MESSAGES.length);
        el.textContent = TIPS_MESSAGES[tipIndex];
        if (tipInterval) clearInterval(tipInterval);
        tipInterval = setInterval(() => {
            tipIndex = (tipIndex + 1) % TIPS_MESSAGES.length;
            el.textContent = TIPS_MESSAGES[tipIndex];
        }, 12000);
    }
    function detenerRotacionTips() {
        if (tipInterval) { clearInterval(tipInterval); tipInterval = null; }
    }

    // ========== INICIO ==========
    window.onload = async () => {
        await openDB();
        renderizarFormulario();
        iniciarRotacionTips();
        document.getElementById('closeTipsBtn')?.addEventListener('click', () => {
            document.getElementById('tipsBanner').style.display = 'none';
            detenerRotacionTips();
        });
    };
</script>
</body>
</html>
