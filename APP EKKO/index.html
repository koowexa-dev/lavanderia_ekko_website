<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EKKO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #0B2F5F;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cargando {
            text-align: center;
            padding: 1.5rem;
            width: 100%;
            max-width: 90%;
        }
        .marca {
            color: white;
            font-size: clamp(1.75rem, 6vw, 2.5rem);
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-bottom: 1rem;
            line-height: 1.2;
            word-break: break-word;
        }
        .estado {
            color: rgba(255, 255, 255, 0.88);
            font-size: clamp(0.9rem, 4vw, 1.1rem);
            font-weight: 400;
            line-height: 1.4;
        }
    </style>
    <meta http-equiv="refresh" content="4; url=https://koowexa-dev.github.io/app_ekko/">
</head>
<body>
    <div class="cargando">
        <div class="marca">LAVANDERIA EKKO</div>
        <div class="estado">Cargando...</div>
    </div>
</body>
</html>
