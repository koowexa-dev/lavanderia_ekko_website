<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes,viewport-fit=cover">
    <title>ADMIN EKKO</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#eef2f5;padding:8px}
        .app{max-width:1000px;margin:0 auto}
        .card{background:#fff;border-radius:16px;padding:12px 14px;border:1px solid #e2e8f0}
        .card h1{font-size:1.4rem;font-weight:600;color:#0f2b3d}
        .card .sub{font-size:0.75rem;color:#2c3e50;margin-bottom:12px;border-left:3px solid #2c6e9e;padding-left:8px}
        .section{background:#fff;border:1px solid #e9edf2;border-radius:12px;padding:8px 10px;margin-bottom:10px}
        .section h4{font-size:0.8rem;font-weight:600;color:#1e4663;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border-left:3px solid #2c6e9e;padding-left:6px}
        .vertical-list{display:flex;flex-direction:column;gap:6px}
        .field{display:flex;flex-direction:column;gap:2px}
        .field label{font-size:0.65rem;font-weight:600;color:#334155;text-transform:uppercase;letter-spacing:0.2px}
        input,select,textarea{padding:6px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:0.8rem;background:#fff;font-family:inherit}
        input:read-only{background:#f1f5f9;color:#475569;cursor:not-allowed}
        textarea{resize:vertical}
        input:focus,select:focus,textarea:focus{outline:none;border-color:#2c6e9e;box-shadow:0 0 0 2px rgba(44,110,158,0.1)}
        .check-vertical{display:flex;flex-direction:column;gap:4px;margin-top:2px}
        .check-vertical label{display:flex;align-items:center;gap:6px;font-size:0.75rem;font-weight:400;background:#f8fafc;padding:4px 10px;border-radius:20px;border:1px solid #e2e8f0;cursor:pointer}
        .check-vertical label:hover{background:#eef2ff;border-color:#b9d0f0}
        .totales{background:#f1f5f9;border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin-bottom:8px;font-size:0.75rem;font-weight:500}
        .totales div{background:#fff;padding:4px 8px;border-radius:30px;text-align:center}
        .actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:12px}
        button{background:#f1f5f9;border:1px solid #cbd5e1;padding:6px 16px;border-radius:30px;font-size:0.75rem;font-weight:500;cursor:pointer}
        button.primary{background:#2c6e9e;color:#fff;border:none}
        button.whatsapp{background:#25D366;color:#fff;border:none}
        .toast{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:4px 16px;border-radius:30px;font-size:0.7rem;text-align:center;z-index:3000;pointer-events:none;width:fit-content;max-width:300px;opacity:0;visibility:hidden}
        @media(max-width:560px){.card{padding:8px}.section{padding:6px}.totales{grid-template-columns:1fr 1fr}}
        .servicios-container{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
        .servicio-item{background:#fefce8;border:1px solid #fde047;border-radius:14px;padding:10px}
        .servicio-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        .servicio-header span{font-weight:600;color:#854d0e;font-size:0.7rem;background:#fffbeb;padding:2px 10px;border-radius:30px}
        .servicio-fields{display:flex;flex-direction:column;gap:8px}
        .remove-servicio{background:none;border:none;font-size:0.9rem;font-weight:bold;cursor:pointer;color:#b91c1c;padding:0 6px}
        .add-servicio-btn{margin-top:4px;background:#e6f7e6;border:1px dashed #2c6e9e;width:100%;border-radius:30px;font-weight:500;padding:6px}
        .total-destacado{font-weight:700;background:#d9e8f2!important}
    </style>
</head>
<body>
    <div class="app">
        <div class="card">
            <h1>Lavandería EKKO</h1>
            <div class="sub">Administración de órdenes</div>
            <div id="formRoot"></div>
            <div class="actions">
                <button id="previewBtn">Previsualizar</button>
                <button id="downloadBtn" class="primary">Descargar TXT</button>
                <button id="whatsappBtn" class="whatsapp">WhatsApp</button>
            </div>
        </div>
    </div>
    <div id="globalToast" class="toast">Mensaje</div>

    <script>
        const PRECIOS_KG={
            BASICO:{'1-2':700,'3-4':900,'5-6':1100,'7':1300},
            WORKING:{'1-2':900,'3-4':1200},
            PREMIUM:{'1-2':800,'3-4':1000,'5-6':1200,'7':1400},
            DEPORTE:{'1-2':800,'3-4':1000},
            VESTIR:{'1-2':1000,'3-4':1200},
            UNIFORME:{'1-2':1000,'3-4':1200},
            ESPECIAL:{'1-2':900,'3-4':1100,'5-6':1300,'7':1500}
        };
        const PRECIOS_BABY={'BABY EKKO 1':{nombre:'BABY EKKO 1',peso:'5kg',precioUnitario:1500},'BABY EKKO 2':{nombre:'BABY EKKO 2',peso:'5kg',precioUnitario:2500}};
        const COSTO_MENSAJERIA={'Zona Corta $600':600,'Zona Media $900':900,'Zona Larga $1200':1200};
        const ZONA_KEYWORDS={corta:'Zona Corta $600',media:'Zona Media $900',larga:'Zona Larga $1200',centro:'Zona Corta $600',sur:'Zona Media $900',norte:'Zona Larga $1200'};
        const PRECIOS_EXTRAS={dlrBlanca:300,dlrOscura:300,dlrColor:300,fragancia:400,perlas:600,perfume:300,semiSucio:200,sucio:400,manchado:800,peluchePeq:300,pelucheMed:500,mantaBebe:400,edredonCuna:600,protectorColchon:500,tratamientoManchas:300};
        const EXTRAS_NOMBRES={dlrBlanca:'D.L.R Blanca',dlrOscura:'D.L.R Oscura',dlrColor:'D.L.R Color',fragancia:'Fragancia',perlas:'Perlas',perfume:'Perfume',semiSucio:'Semi Sucio',sucio:'Sucio',manchado:'Manchado',peluchePeq:'Peluche pequeno',pelucheMed:'Peluche mediano',mantaBebe:'Manta bebe',edredonCuna:'Edredon cuna',protectorColchon:'Protector colchon',tratamientoManchas:'Tratamiento intenso'};
        const CATEGORIAS_EXTRAS={'Lavados por color':['dlrBlanca','dlrOscura','dlrColor'],'Aromas':['fragancia','perlas','perfume'],'Estado de la ropa':['semiSucio','sucio','manchado'],'Peluches y artículos':['peluchePeq','pelucheMed','mantaBebe','edredonCuna','protectorColchon'],'Extras adicionales':['tratamientoManchas']};

        function obtenerPrecioPorPeso(plan,peso){
            const rangos=PRECIOS_KG[plan]; if(!rangos)return 0;
            const entradas=Object.entries(rangos).sort((a,b)=>{const la=parseFloat(a[0].split('-')[1]||a[0]);const lb=parseFloat(b[0].split('-')[1]||b[0]);return la-lb;});
            for(let [r,pre] of entradas){const p=r.split('-');if(p.length===1){if(peso>=parseFloat(p[0]))return pre;}else{const min=parseFloat(p[0]),max=parseFloat(p[1]);if(peso>=min&&peso<=max)return pre;}}
            const ult=entradas[entradas.length-1];return ult?ult[1]:0;
        }

        let servicios=[], nextId=1;
        const $=id=>document.getElementById(id);
        const getVal=(id,def)=>{const e=$(id);return e?(e.value||'').trim()||def||'':'';};
        const getChecked=id=>{const e=$(id);return e?e.checked:false;};
        const setVal=(id,val)=>{const e=$(id);if(e)e.value=val;};

        function generarNumeroOrden(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+Math.random().toString(36).substring(2,6).toUpperCase();}
        function toastMsg(msg,isErr){const t=$('globalToast');if(!t)return;t.innerText=msg;t.style.backgroundColor=isErr?'#b91c1c':'#1e293b';t.style.visibility='visible';t.style.opacity='1';setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.style.visibility='hidden',250);},2300);}

        function calcularCostoServicio(serv){
            const plan=serv.tipo;
            if(plan==='BABY EKKO 1')return (serv.babyQty||1)*PRECIOS_BABY['BABY EKKO 1'].precioUnitario;
            if(plan==='BABY EKKO 2')return (serv.babyQty||1)*PRECIOS_BABY['BABY EKKO 2'].precioUnitario;
            return obtenerPrecioPorPeso(plan, serv.peso||1);
        }
        function calcTotalServicios(){return servicios.reduce((s,sv)=>s+calcularCostoServicio(sv),0);}
        function calcExtras(){let t=0;for(let e in PRECIOS_EXTRAS)if(PRECIOS_EXTRAS.hasOwnProperty(e)&&getChecked('extra_'+e))t+=PRECIOS_EXTRAS[e];return t;}
        function calcDelivery(){const z=getVal('zoneSelect','Zona Corta $600');return COSTO_MENSAJERIA[z]||0;}

        function actualizarTotales(){
            const servTotal=calcTotalServicios(), extra=calcExtras(), iron=parseFloat(getVal('ironCost','0'))||0, delivery=calcDelivery(), total=servTotal+extra+iron+delivery;
            if($('servMount'))$('servMount').innerText='$'+servTotal;
            if($('extraMount'))$('extraMount').innerText='$'+extra;
            if($('ironMount'))$('ironMount').innerText='$'+iron;
            if($('deliveryMount'))$('deliveryMount').innerText='$'+delivery;
            if($('totalMount'))$('totalMount').innerText='$'+total;
            const pago=parseFloat(getVal('receivedPay','0'))||0, cambio=pago-total;
            if($('changeMount'))$('changeMount').innerHTML=cambio>=0?'$'+cambio:'-$'+Math.abs(cambio);
            if($('hiddenTotal'))$('hiddenTotal').value=total;
        }

        function suggestZoneByAddress(){const addr=getVal('address').toLowerCase();if(!addr)return;for(let k in ZONA_KEYWORDS)if(ZONA_KEYWORDS.hasOwnProperty(k)&&addr.includes(k)){setVal('zoneSelect',ZONA_KEYWORDS[k]);actualizarTotales();break;}}

        function renderServicios(){
            const container=$('serviciosListContainer'); if(!container)return;
            if(!servicios.length){container.innerHTML='<div style="padding:8px;text-align:center;background:#f9f9f9;border-radius:12px;">+ Agrega servicios</div>';return;}
            container.innerHTML='';
            servicios.forEach((serv,idx)=>{
                const div=document.createElement('div');div.className='servicio-item';div.dataset.id=serv.id;
                const isBaby=serv.tipo==='BABY EKKO 1'||serv.tipo==='BABY EKKO 2';
                const costo=calcularCostoServicio(serv);
                div.innerHTML=`
                    <div class="servicio-header"><span>Servicio #${idx+1}</span><button class="remove-servicio" data-id="${serv.id}">✕</button></div>
                    <div class="servicio-fields">
                        <div class="field"><label>TIPO PLAN</label><select class="serv-tipo" data-id="${serv.id}">
                            ${['BASICO','WORKING','PREMIUM','DEPORTE','VESTIR','UNIFORME','ESPECIAL','BABY EKKO 1','BABY EKKO 2'].map(p=>`<option value="${p}" ${serv.tipo===p?'selected':''}>${p}</option>`).join('')}
                        </select></div>
                        ${isBaby?`<div class="field"><label>CANTIDAD PAQUETES (5kg)</label><input type="number" class="serv-babyqty" data-id="${serv.id}" value="${serv.babyQty||1}" min="1" step="1"></div>`
                        :`<div class="field"><label>PESO (kg)</label><input type="number" step="0.1" class="serv-peso" data-id="${serv.id}" value="${serv.peso||1}" min="0.1"></div>`}
                        <div class="field"><label>COSTO</label><div style="background:#eef2ff;padding:4px 8px;border-radius:8px;font-weight:bold;">$${costo}</div></div>
                    </div>`;
                container.appendChild(div);
            });
            document.querySelectorAll('.remove-servicio').forEach(b=>b.addEventListener('click',function(){const id=parseInt(this.dataset.id);eliminarServicio(id);}));
            document.querySelectorAll('.serv-tipo').forEach(s=>s.addEventListener('change',function(){const id=parseInt(this.dataset.id),newTipo=this.value,serv=servicios.find(s=>s.id===id);if(serv){serv.tipo=newTipo;if(newTipo==='BABY EKKO 1'||newTipo==='BABY EKKO 2'){serv.peso=undefined;serv.babyQty=serv.babyQty||1;}else{serv.babyQty=undefined;serv.peso=serv.peso||1;}renderServicios();actualizarTotales();}}));
            document.querySelectorAll('.serv-peso').forEach(inp=>inp.addEventListener('input',function(){const id=parseInt(this.dataset.id),val=parseFloat(this.value);if(!isNaN(val)&&val>0){const serv=servicios.find(s=>s.id===id);if(serv){serv.peso=val;renderServicios();actualizarTotales();}}}));
            document.querySelectorAll('.serv-babyqty').forEach(inp=>inp.addEventListener('change',function(){const id=parseInt(this.dataset.id),qty=Math.max(1,parseInt(this.value)||1);const serv=servicios.find(s=>s.id===id);if(serv){serv.babyQty=qty;renderServicios();actualizarTotales();}}));
            actualizarTotales();
        }

        function eliminarServicio(id){servicios=servicios.filter(s=>s.id!==id);renderServicios();actualizarTotales();}
        function agregarServicio(){const nuevoId=nextId++;servicios.push({id:nuevoId,tipo:'BASICO',peso:1,babyQty:null});renderServicios();actualizarTotales();}

        function obtenerDatosCompletos(){
            const orden=getVal('ordNum')||generarNumeroOrden(), cliente=getVal('cliName')||'---', telefono=getVal('cliPhone')||'---', fechaRec=getVal('recDate')||'---', fechaEnt=getVal('delDate')||'---', direccion=getVal('address')||'---', zona=getVal('zoneSelect')||'---';
            let detalle=[], totalServ=0;
            servicios.forEach((s,i)=>{const c=calcularCostoServicio(s);totalServ+=c;detalle.push((i+1)+'. '+s.tipo+(s.tipo.includes('BABY')?' · '+(s.babyQty||1)+' paq(s) 5kg -> $'+c:' · '+(s.peso||1)+' kg -> $'+c));});
            if(!servicios.length)detalle.push('Ningún servicio');
            let extras=[];for(let e in PRECIOS_EXTRAS)if(PRECIOS_EXTRAS.hasOwnProperty(e)&&getChecked('extra_'+e))extras.push(EXTRAS_NOMBRES[e]+' (+$'+PRECIOS_EXTRAS[e]+')');
            const extraMonto=calcExtras(), prendas=getVal('garments'), planchDesc=getVal('ironDesc'), planchCosto=parseFloat(getVal('ironCost','0'))||0, msgRecogida=getChecked('msgPickup'), msgEntrega=getChecked('msgDelivery'), courier=getVal('courierAddr'), deliveryMonto=calcDelivery(), total=totalServ+extraMonto+planchCosto+deliveryMonto, recibido=parseFloat(getVal('receivedPay','0'))||0, cambio=recibido-total, firmaEnc=getVal('signStaff')||'_________________________', firmaCli=getVal('signClient')||'_________________________', piezas=getVal('pieces');
            return{orden,cliente,telefono,fechaRec,fechaEnt,direccion,zona,detalle,totalServ,extras,extraMonto,prendas,planchDesc,planchCosto,msgRecogida,msgEntrega,courier,deliveryMonto,total,recibido,cambio,firmaEnc,firmaCli,piezas};
        }

        function generarTXT(){
            if(!servicios.length){toastMsg('Agrega al menos un servicio',true);return null;}
            const d=obtenerDatosCompletos();
            let txt='============================================================\n              LAVANDERIA EKKO - ORDEN DE SERVICIO           \n============================================================\n\n--- DATOS DEL CLIENTE ---\nN° Orden       : '+d.orden+'\nCliente        : '+d.cliente+'\nTeléfono       : '+d.telefono+'\nDirección      : '+d.direccion+'\nZona mensajería: '+d.zona+'\nFecha recepción: '+d.fechaRec+'\nFecha entrega  : '+d.fechaEnt+'\n\n--- SERVICIOS SOLICITADOS ---\n'+d.detalle.join('\n')+'\nCosto total servicios: $'+d.totalServ+'\n\n';
            if(d.extras.length||d.planchCosto){txt+='--- EXTRAS Y ADICIONALES ---\n'+(d.extras.length?'Extras: '+d.extras.join(', ')+'\n':'')+'Monto extras: $'+d.extraMonto+'\n'+(d.planchDesc?'Planchado: '+d.planchDesc+'\n':'')+'Costo planchado: $'+d.planchCosto+'\n\n';}
            if(d.msgRecogida||d.msgEntrega||d.courier){txt+='--- MENSAJERIA ---\nRecogida a domicilio: '+(d.msgRecogida?'SI':'NO')+'\nEntrega a domicilio: '+(d.msgEntrega?'SI':'NO')+'\n'+(d.courier?'Dirección envio: '+d.courier+'\n':'')+'Costo mensajería: $'+d.deliveryMonto+'\n\n';}
            if(d.prendas)txt+='--- PRENDAS / DETALLE ---\n'+d.prendas+'\n\n';
            if(d.piezas)txt+='--- OBSERVACIONES / PIEZAS ---\n'+d.piezas+'\n\n';
            txt+='--- RESUMEN DE COBRO ---\nServicios de lavandería: $'+d.totalServ+'\nExtras                 : $'+d.extraMonto+'\nPlanchado              : $'+d.planchCosto+'\nMensajería             : $'+d.deliveryMonto+'\nTOTAL A PAGAR          : $'+d.total+'\nRecibido               : $'+d.recibido+'\nCambio / faltante      : '+(d.cambio>=0?'$'+d.cambio:'-$'+Math.abs(d.cambio))+'\n\n--- FIRMAS ---\nEncargado: '+d.firmaEnc+'\nCliente  : '+d.firmaCli+'\n\nDocumento generado el '+new Date().toLocaleString()+' | Lavanderia EKKO\n';
            return txt;
        }

        function generarMensajeWhatsApp(){
            if(!servicios.length){toastMsg('Agrega al menos un servicio',true);return null;}
            const d=obtenerDatosCompletos();
            let msg='LAVANDERIA EKKO - ORDEN DE SERVICIO\n====================================\n\n--- DATOS DEL CLIENTE ---\nN° Orden       : '+d.orden+'\nCliente        : '+d.cliente+'\nTeléfono       : '+d.telefono+'\nDirección      : '+d.direccion+'\nZona mensajería: '+d.zona+'\nFecha recepción: '+d.fechaRec+'\nFecha entrega  : '+d.fechaEnt+'\n\n--- SERVICIOS SOLICITADOS ---\n'+d.detalle.join('\n')+'\nCosto total servicios: $'+d.totalServ+'\n\n';
            if(d.extras.length||d.planchCosto){msg+='--- EXTRAS Y ADICIONALES ---\n'+(d.extras.length?'Extras: '+d.extras.join(', ')+'\n':'')+'Monto extras: $'+d.extraMonto+'\n'+(d.planchDesc?'Planchado: '+d.planchDesc+'\n':'')+'Costo planchado: $'+d.planchCosto+'\n\n';}
            if(d.msgRecogida||d.msgEntrega||d.courier){msg+='--- MENSAJERIA ---\nRecogida a domicilio: '+(d.msgRecogida?'SI':'NO')+'\nEntrega a domicilio: '+(d.msgEntrega?'SI':'NO')+'\n'+(d.courier?'Dirección envio: '+d.courier+'\n':'')+'Costo mensajería: $'+d.deliveryMonto+'\n\n';}
            if(d.prendas)msg+='--- PRENDAS / DETALLE ---\n'+d.prendas+'\n\n';
            if(d.piezas)msg+='--- OBSERVACIONES / PIEZAS ---\n'+d.piezas+'\n\n';
            msg+='--- RESUMEN DE COBRO ---\nServicios de lavandería: $'+d.totalServ+'\nExtras                 : $'+d.extraMonto+'\nPlanchado              : $'+d.planchCosto+'\nMensajería             : $'+d.deliveryMonto+'\nTOTAL A PAGAR          : $'+d.total+'\nRecibido               : $'+d.recibido+'\nCambio / faltante      : '+(d.cambio>=0?'$'+d.cambio:'-$'+Math.abs(d.cambio))+'\n\n--- FIRMAS ---\nEncargado: '+d.firmaEnc+'\nCliente  : '+d.firmaCli+'\n\nDocumento generado el '+new Date().toLocaleString()+' | Lavanderia EKKO';
            return msg;
        }

        function descargarTXT(){const txt=generarTXT();if(!txt)return;const orden=getVal('ordNum')||generarNumeroOrden();const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='orden_'+orden+'.txt';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);toastMsg('TXT descargado');}
        function previsualizarTXT(){const txt=generarTXT();if(!txt)return;const modal=document.createElement('div');modal.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:10000;display:flex;align-items:center;justify-content:center;';const card=document.createElement('div');card.style.cssText='background:#fff;border-radius:20px;max-width:90%;max-height:85%;overflow:auto;padding:16px;width:650px;';card.innerHTML='<h3 style="margin-bottom:8px;">Previsualización</h3><pre style="font-family:monospace;font-size:11px;white-space:pre-wrap;background:#f8fafc;padding:8px;border-radius:8px;">'+txt.replace(/[&<>]/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m]))+'</pre><button id="closePreview" style="margin-top:12px;padding:6px 20px;border-radius:30px;border:none;background:#2c6e9e;color:#fff;">Cerrar</button>';modal.appendChild(card);document.body.appendChild(modal);document.getElementById('closePreview').onclick=()=>modal.remove();}
        function enviarWhatsApp(){const raw=getVal('cliPhone');if(!raw){toastMsg('Ingresa teléfono del cliente',true);return;}let num=raw.replace(/[^\d+]/g,'');if(!num.startsWith('+')){if(num.startsWith('56'))num='+'+num;else num='+56'+num;}num=num.replace(/\s/g,'');const msg=generarMensajeWhatsApp();if(!msg)return;window.open('https://wa.me/'+encodeURIComponent(num)+'?text='+encodeURIComponent(msg),'_blank');toastMsg('WhatsApp abierto');}

        function construirFormulario(){
            const root=$('formRoot'); if(!root)return;
            let extrasHtml='';for(let cat in CATEGORIAS_EXTRAS){if(CATEGORIAS_EXTRAS.hasOwnProperty(cat)){extrasHtml+='<div class="section"><h4>'+cat+'</h4><div class="check-vertical">';CATEGORIAS_EXTRAS[cat].forEach(e=>{if(PRECIOS_EXTRAS[e]!==undefined)extrasHtml+='<label><input type="checkbox" id="extra_'+e+'"> '+EXTRAS_NOMBRES[e]+' <span style="margin-left:auto;font-weight:500;">+$'+PRECIOS_EXTRAS[e]+'</span></label>';});extrasHtml+='</div></div>';}}
            root.innerHTML=`
                <div class="section"><h4>DATOS DEL CLIENTE</h4><div class="vertical-list">
                    <div class="field"><label>N° Orden</label><input type="text" id="ordNum" placeholder="Auto"></div>
                    <div class="field"><label>Cliente</label><input type="text" id="cliName" placeholder="Nombre"></div>
                    <div class="field"><label>Teléfono</label><input type="tel" id="cliPhone" placeholder="+569XXXXXXXX"></div>
                    <div class="field"><label>Fecha Recepción</label><input type="date" id="recDate"></div>
                    <div class="field"><label>Fecha Entrega</label><input type="date" id="delDate"></div>
                    <div class="field"><label>Dirección</label><input type="text" id="address" placeholder="Calle, número"></div>
                    <div class="field"><label>Zona</label><select id="zoneSelect"><option value="Zona Corta $600">Zona Corta ($600)</option><option value="Zona Media $900">Zona Media ($900)</option><option value="Zona Larga $1200">Zona Larga ($1200)</option></select></div>
                </div></div>
                <div class="section"><h4>SERVICIOS</h4><div id="serviciosListContainer" class="servicios-container"></div><button type="button" id="addServicioBtn" class="add-servicio-btn">+ Agregar servicio</button></div>
                ${extrasHtml}
                <div class="section"><h4>PRENDAS</h4><textarea id="garments" rows="2" placeholder="Ej: Camisas x3 (1.2 kg)"></textarea></div>
                <div class="section"><h4>PLANCHADO</h4><div class="vertical-list"><div class="field"><label>Descripción</label><input type="text" id="ironDesc" placeholder="Ej: Camisas, pantalones"></div><div class="field"><label>Costo ($)</label><input type="number" id="ironCost" value="0" step="100"></div></div></div>
                <div class="section"><h4>MENSAJERIA</h4><div class="check-vertical"><label><input type="checkbox" id="msgPickup"> Recogida a domicilio</label><label><input type="checkbox" id="msgDelivery"> Entrega a domicilio</label></div><div class="field" style="margin-top:6px;"><input type="text" id="courierAddr" placeholder="Dirección para mensajería"></div></div>
                <div class="section"><h4>FIRMAS</h4><div class="vertical-list"><div class="field"><label>Encargado</label><input type="text" id="signStaff" value="76041701461" readonly></div><div class="field"><label>Cliente</label><input type="text" id="signClient" placeholder="Nombre cliente"></div></div></div>
                <div class="section"><h4>OBSERVACIONES</h4><textarea id="pieces" rows="2" placeholder="Detalles adicionales"></textarea></div>
                <div class="section" id="resumenFinalSection"><h4>RESUMEN DE COBRO</h4>
                    <div class="totales">
                        <div>Servicios: <span id="servMount">$0</span></div>
                        <div>Extras: <span id="extraMount">$0</span></div>
                        <div>Planchado: <span id="ironMount">$0</span></div>
                        <div>Mensajería: <span id="deliveryMount">$0</span></div>
                        <div class="total-destacado">TOTAL: <span id="totalMount">$0</span></div>
                    </div>
                    <div class="vertical-list">
                        <div class="field"><label>Monto recibido ($)</label><input type="number" id="receivedPay" value="0" step="100"></div>
                        <div class="field"><label>Cambio / faltante</label><span id="changeMount" style="background:#eef2ff;padding:4px 12px;border-radius:30px;display:inline-block;">$0</span></div>
                    </div>
                    <input type="hidden" id="hiddenTotal">
                </div>`;

            const hoy=new Date().toISOString().split('T')[0]; const futuro=new Date(Date.now()+2*86400000).toISOString().split('T')[0];
            if(!getVal('recDate'))setVal('recDate',hoy); if(!getVal('delDate'))setVal('delDate',futuro);
            servicios=[]; nextId=1; agregarServicio();
            $('addServicioBtn')?.addEventListener('click',agregarServicio);
            for(let e in PRECIOS_EXTRAS)if(PRECIOS_EXTRAS.hasOwnProperty(e)){const c=$('extra_'+e);if(c)c.addEventListener('change',actualizarTotales);}
            $('ironCost')?.addEventListener('input',actualizarTotales);
            $('receivedPay')?.addEventListener('input',actualizarTotales);
            $('address')?.addEventListener('blur',suggestZoneByAddress);
            $('zoneSelect')?.addEventListener('change',actualizarTotales);
            actualizarTotales();
        }

        document.addEventListener('DOMContentLoaded',function(){
            $('downloadBtn')?.addEventListener('click',descargarTXT);
            $('previewBtn')?.addEventListener('click',previsualizarTXT);
            $('whatsappBtn')?.addEventListener('click',enviarWhatsApp);
            construirFormulario();
        });
    </script>
</body>
</html>
